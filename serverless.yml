org: luisnieva
service: ms-auth

provider:
  name: aws
  runtime: python3.12
  timeout: 30
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole

functions:
  auth:
    name: Auth
    handler: auth.lambda_handler
    events:
      - http:
          path: /auth/login
          method: post
          cors: true
          integration: lambda
      - http:
          path: /auth/crear-usuario
          method: post
          cors: true
          integration: lambda
  validar_token:
    name: ValidarTokenAcceso
    handler: validar_token.lambda_handler

resources:
  Resources:
    TablaUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_usuarios
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: usuario_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: usuario_id
            KeyType: RANGE
    TablaTokens:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: t_tokens_acceso
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
